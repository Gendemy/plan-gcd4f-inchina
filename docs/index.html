/* =====================================================================
   Gendemy Design System · áp cho trang kế hoạch GCD4F
   Font duy nhất: FZ Poppins · Navy / Prussian / Turquoise · bo góc mềm
   ===================================================================== */

:root{
  color-scheme:light;
  --font:"FzPoppins","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;

  /* thương hiệu */
  --navy:#18186b; --prussian:#234c87; --turq:#61d2e5; --action:#3E7EFF;
  --turq-ink:#0e7490;                 /* turquoise đủ tương phản để làm chữ trên nền sáng */

  /* bề mặt */
  --bg:#f9fafb; --card:#ffffff; --card-2:#f3f4f6; --active:#DCE8FF;
  --line:rgba(229,231,235,.9); --line-soft:#f3f4f6;
  --glass:rgba(255,255,255,.8);

  /* chữ */
  --heading:#18186b; --text:#111827; --text-2:#374151; --muted:#6b7280;

  /* trạng thái */
  --success:#16a34a; --warn:#d97706; --warn-bg:#fffbeb; --warn-line:#fde68a; --warn-ink:#b45309;
  --info-bg:#f0f6ff; --info-line:rgba(62,126,255,.18);

  /* màu nhấn theo thành phố, đều nằm trong dải xanh của thương hiệu */
  --c-sh:#3E7EFF; --c-bj:#18186b; --c-tj:#234c87; --c-sz:#0e7490;

  /* chiều sâu */
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(24,24,107,.06);
  --sh-2:0 8px 20px -6px rgba(24,24,107,.14);
  --sh-3:0 10px 22px -6px rgba(62,126,255,.35);

  --r-lg:8px; --r-xl:12px; --r-2xl:16px;
  --side-w:272px;
}

/* Chế độ tối: xám xanh sâu, không dùng đen tuyền */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111827; --card:#1f2937; --card-2:#273244; --active:rgba(49,82,153,.3);
    --line:rgba(75,85,99,.55); --line-soft:rgba(55,65,81,.6);
    --glass:rgba(31,41,55,.78);
    --heading:#ffffff; --text:#f3f4f6; --text-2:#d1d5db; --muted:#9ca3af;
    --turq-ink:#61d2e5;
    --warn-bg:rgba(245,158,11,.08); --warn-line:rgba(245,158,11,.28); --warn-ink:#fbbf24;
    --info-bg:rgba(62,126,255,.08); --info-line:rgba(62,126,255,.22);
    --c-sh:#7aa7ff; --c-bj:#a5b4fc; --c-tj:#8fb3e6; --c-sz:#61d2e5;
    --sh-1:0 1px 2px rgba(0,0,0,.25); --sh-2:0 10px 24px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111827; --card:#1f2937; --card-2:#273244; --active:rgba(49,82,153,.3);
  --line:rgba(75,85,99,.55); --line-soft:rgba(55,65,81,.6);
  --glass:rgba(31,41,55,.78);
  --heading:#ffffff; --text:#f3f4f6; --text-2:#d1d5db; --muted:#9ca3af;
  --turq-ink:#61d2e5;
  --warn-bg:rgba(245,158,11,.08); --warn-line:rgba(245,158,11,.28); --warn-ink:#fbbf24;
  --info-bg:rgba(62,126,255,.08); --info-line:rgba(62,126,255,.22);
  --c-sh:#7aa7ff; --c-bj:#a5b4fc; --c-tj:#8fb3e6; --c-sz:#61d2e5;
  --sh-1:0 1px 2px rgba(0,0,0,.25); --sh-2:0 10px 24px -8px rgba(0,0,0,.5);
}

/* ---------- nền tảng ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text-2);font-family:var(--font);font-size:13px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;color:var(--heading);font-weight:600;line-height:1.35;text-wrap:balance}
p{margin:0}
strong,b{font-weight:600;color:var(--text)}
em{font-style:normal;font-weight:500;color:var(--text)}
s{color:var(--muted)}
a{color:var(--action);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--turq);outline-offset:2px;border-radius:6px}
.mono{font-variant-numeric:tabular-nums;font-weight:500;color:var(--text)}
.han{letter-spacing:.02em}
.muted{color:var(--muted)}

/* thanh cuộn siêu mảnh */
*{scrollbar-width:thin;scrollbar-color:rgba(107,114,128,.35) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(107,114,128,.35);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(107,114,128,.55)}

/* icon Lucide */
.ic{width:16px;height:16px;flex:none;vertical-align:-3px;stroke-width:1.9;overflow:visible}

/* logo đổi theo giao diện */
.logo-d{display:none}
:root[data-theme="dark"] .logo-l{display:none}
:root[data-theme="dark"] .logo-d{display:block}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .logo-l{display:none}
  :root:not([data-theme="light"]) .logo-d{display:block}
}

/* =====================================================================
   KHUNG TRANG: sidebar trái trên desktop, header + bottom bar trên mobile
   ===================================================================== */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);z-index:50;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:22px;padding:22px 18px 18px;overflow-y:auto}
.side-top{display:flex;flex-direction:column;gap:22px}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand img{height:22px;width:auto}
.brand .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-actions{display:none;gap:6px}
.side-group{display:flex;flex-direction:column;gap:8px}
.side-label{font-size:11px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 4px}
.side-label .ic{width:14px;height:14px}

/* segmented control kiểu macOS */
.seg{display:flex;background:var(--card-2);border-radius:var(--r-lg);padding:3px;gap:2px}
.seg button{flex:1;font:500 12.5px/1.2 var(--font);color:var(--muted);background:transparent;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;transition:background .15s,color .15s,transform .1s;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--card);color:var(--heading);box-shadow:var(--sh-1)}
.seg button:active{transform:scale(.95)}

/* danh sách chọn người */
.people{display:flex;flex-direction:column;gap:2px}
.people button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:500 13px/1.3 var(--font);color:var(--text-2);background:transparent;border:0;border-radius:var(--r-lg);padding:8px 10px;cursor:pointer;transition:background .15s,color .15s}
.people button .ic{color:var(--muted)}
.people button:hover{background:var(--card-2)}
.people button.on{background:var(--active);color:var(--heading);font-weight:600}
.people button.on .ic{color:var(--turq-ink)}

/* mục lục */
.side-nav{display:flex;flex-direction:column;gap:1px;flex:1}
.side-nav a{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--text-2);padding:7px 10px;border-radius:var(--r-lg);text-decoration:none;transition:background .15s,color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-nav a .ic{color:var(--muted)}
.side-nav a:hover{background:var(--card-2)}
.side-nav a.on{background:var(--active);color:var(--heading)}
.side-nav a.on .ic{color:var(--turq-ink)}
.side-nav .city-dot{width:8px;height:8px;border-radius:99px;background:var(--accent);flex:none;margin:0 4px}
.daychips{display:flex;flex-wrap:wrap;gap:4px;padding:2px 10px 8px 36px}
.daychips a{font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted);min-width:28px;text-align:center;padding:2px 6px;border-radius:6px;border:1px solid var(--line);text-decoration:none;transition:all .15s}
.daychips a:hover{color:var(--heading);border-color:var(--turq)}
.daychips a.on{background:var(--navy);border-color:var(--navy);color:#fff}

.side-foot{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}

/* nút bấm */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 13px/1.2 var(--font);border-radius:var(--r-lg);padding:9px 16px;cursor:pointer;border:1px solid transparent;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.6;cursor:default}
.btn-primary{background:var(--navy);color:#fff;box-shadow:var(--sh-3)}
.btn-primary:hover{background:var(--prussian);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--heading);border-color:rgba(97,210,229,.5)}
.btn-outline:hover{background:rgba(97,210,229,.1)}
:root[data-theme="dark"] .btn-primary{background:var(--action)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn-primary{background:var(--action)} }
.btn-icon{width:34px;height:34px;padding:0;border-radius:var(--r-lg);background:var(--card-2);color:var(--text-2);border:0}
.btn-icon:hover{color:var(--heading)}

/* phần nội dung */
.main{margin-left:var(--side-w);min-height:100vh}
#app{max-width:920px;margin:0 auto;padding:32px 40px 96px}
#app > *{animation:gd-in .35s ease-out both}
@keyframes gd-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.bbar{display:none}

/* =====================================================================
   HERO
   ===================================================================== */
.hero-card{position:relative;overflow:hidden;border-radius:var(--r-2xl);padding:32px 34px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,rgba(97,210,229,.28) 0%,rgba(97,210,229,0) 45%),linear-gradient(135deg,#18186b 0%,#1e2f78 55%,#234c87 100%);
  box-shadow:0 18px 40px -18px rgba(24,24,107,.55);display:grid;grid-template-columns:1fr 168px;gap:24px;align-items:center}
.hero-card::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,.08);pointer-events:none}
.hero-card .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--turq);margin-bottom:10px}
.hero-card .kicker .ic{width:15px;height:15px}
.hero-card h1{color:#fff;font-size:24px;font-weight:700;letter-spacing:-.01em}
.hero-card .lede{margin-top:10px;max-width:60ch;color:rgba(255,255,255,.82);font-size:13px}
.hero-card .lede strong{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;backdrop-filter:blur(8px)}
.chip .ic{width:14px;height:14px;color:var(--turq)}
.hero-mascot{width:168px;height:auto;opacity:.95;filter:drop-shadow(0 12px 24px rgba(0,0,0,.25))}
.tz{margin-top:14px}

/* =====================================================================
   SECTION
   ===================================================================== */
section{padding-top:48px;scroll-margin-top:24px}
.sec-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.sec-head .eyebrow{margin-left:auto}
.sic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:var(--r-lg);background:rgba(97,210,229,.16);color:var(--turq-ink);flex:none}
.sic .ic{width:16px;height:16px}
.sic.warn{background:rgba(245,158,11,.14);color:var(--warn-ink)}
.eyebrow{font-size:11px;font-weight:500;color:var(--muted);background:var(--card-2);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}
.sec-note{margin:0 0 18px;max-width:68ch;color:var(--text-2)}
.subhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:36px 0 10px}
.subhead h3{font-size:14px}

/* thẻ (cấp 1) và hiệu ứng nổi (cấp 2) */
.card,.track,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-1)}
.card,.track{transition:transform .18s ease,box-shadow .18s ease}
.card:hover,.track:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}

.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.track{padding:20px 22px;position:relative;overflow:hidden}
.track::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tc)}
.track.a{--tc:var(--turq)} .track.b{--tc:var(--action)}
.track h3{font-size:14px}
.track .names{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;font-weight:500;color:var(--prussian);background:var(--active);border-radius:99px;padding:3px 10px}
:root[data-theme="dark"] .track .names{color:#bfd4ff}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .track .names{color:#bfd4ff} }
.track p{margin-top:10px}

.urgent{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.card .num{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--warn-ink);font-variant-numeric:tabular-nums}
.card .num .sic{width:32px;height:32px}
.card h3{font-size:14px}

/* bảng */
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-1)}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:13px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line-soft);vertical-align:top}
thead th{font-size:11px;font-weight:500;color:var(--muted);background:var(--card-2);border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(220,232,255,.35)}
tbody tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;color:var(--text)}
th.num{text-align:right}
tr.total td{background:var(--card-2);font-weight:600;color:var(--heading);border-top:1px solid var(--line)}
td.when span{display:inline-block;font-size:11.5px;font-weight:500;color:var(--prussian);background:var(--active);border-radius:99px;padding:2px 10px;white-space:nowrap}
:root[data-theme="dark"] td.when span{color:#bfd4ff}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) td.when span{color:#bfd4ff} }

/* ghi chú & cảnh báo */
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);border:1px solid var(--info-line);border-radius:var(--r-lg);padding:12px 14px;color:var(--text-2)}
.note .ic.nt{width:16px;height:16px;margin-top:2px;color:var(--action)}
.note + .note{margin-top:10px}
.callout{margin-top:18px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r-xl);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.callout h3{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--warn-ink)}
.callout .fix{color:var(--text);padding-top:10px;border-top:1px dashed var(--warn-line)}

/* =====================================================================
   THÀNH PHỐ & NGÀY
   ===================================================================== */
.city{padding-top:56px;scroll-margin-top:24px}
#sh{--accent:var(--c-sh)} #bj{--accent:var(--c-bj)} #tj{--accent:var(--c-tj)} #sz{--accent:var(--c-sz)}
.city-band{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.city-band h2{font-size:20px;font-weight:700;color:var(--accent)}
.city-band .cn{font-size:13px;font-weight:500;color:var(--accent);border:1px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:2px 10px}
.city-band .span{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.city-band .span .ic{width:14px;height:14px;color:var(--turq-ink)}
.city-intro{margin:12px 0 0;max-width:70ch}

figure.hero{margin:16px 0 0;border-radius:var(--r-2xl);overflow:hidden;background:var(--card-2);box-shadow:var(--sh-1);position:relative}
figure.hero img{display:block;width:100%;height:clamp(180px,28vw,300px);object-fit:cover}
figure.hero figcaption{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);font-size:11px;background:rgba(17,24,39,.55);backdrop-filter:blur(8px);color:#fff;border-radius:99px;padding:4px 12px}
figure.hero figcaption a{color:#fff}
figure.shot{margin:12px 0 0;max-width:440px}
figure.shot img{display:block;width:100%;height:200px;object-fit:cover;border-radius:var(--r-xl);background:var(--card-2);box-shadow:var(--sh-1)}
figure.shot figcaption{font-size:11px;color:var(--muted);padding:6px 2px 0}
figure.shot figcaption a{color:var(--muted)}
.banner{display:block;width:100%;height:auto;margin:16px 0 0;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);padding:14px 10px 4px}
.banner .ln{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.banner .soft{fill:none;stroke:currentColor;stroke-width:1;opacity:.34}
.figcap{font-size:11px;color:var(--muted);margin-top:6px}

.day{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--sh-1);
  display:grid;grid-template-columns:64px 1fr;gap:22px;padding:24px;scroll-margin-top:24px}
.daymark{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;align-items:center;gap:0;
  background:var(--accent);color:#fff;border-radius:var(--r-xl);padding:10px 4px 9px;box-shadow:0 8px 18px -10px var(--accent)}
.daymark .dnum{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.daymark .dmon{font-size:10px;opacity:.85;white-space:nowrap}
.daymark .ddow{font-size:10px;font-weight:600;opacity:.95;white-space:nowrap;margin-top:2px}
:root[data-theme="dark"] .daymark{color:#111827}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .daymark{color:#111827} }
.daybody{display:flex;flex-direction:column;gap:14px;min-width:0}
.dayhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dayhead h3{font-size:15px;flex:1 1 240px}
.glyph{width:40px;height:40px;flex:none;color:var(--accent);background:var(--card-2);border-radius:var(--r-lg);padding:5px}
.intro{max-width:70ch}

/* dòng thời gian */
.slots{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:96px 1fr;gap:16px}
.slot .t{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--muted);padding-top:12px;white-space:nowrap}
.slot .a{position:relative;min-width:0;padding:10px 0 12px 20px;border-left:2px solid var(--line)}
.slot .a::before{content:"";position:absolute;left:-6px;top:17px;width:10px;height:10px;border-radius:99px;background:var(--card);border:2px solid var(--turq)}
.slot:first-child .a{padding-top:0} .slot:first-child .t{padding-top:2px} .slot:first-child .a::before{top:7px}
.slot .a > b{font-size:13.5px;font-weight:600;color:var(--text);margin-right:6px}
.slot .a .d{display:block;margin-top:4px;color:var(--text-2)}
.slot.move .t{font-size:11px;padding-top:6px;opacity:.85}
.slot.move .a{display:flex;gap:10px;align-items:flex-start;padding:6px 0 8px 20px;border-left:2px dashed var(--line);font-size:12px;color:var(--muted)}
.slot.move .a::before{display:none}
.slot.move .a .ic.mv{width:15px;height:15px;margin-top:2px;color:var(--turq-ink)}
.slot.move:first-child .a{padding-top:0}

/* nhãn */
.tag,.dur{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;line-height:1.5;border-radius:99px;padding:1px 9px;margin:0 4px 0 0;white-space:nowrap;vertical-align:1px}
.tag .ic{width:12px;height:12px;stroke-width:2.2}
.tag{background:rgba(97,210,229,.16);color:var(--turq-ink)}
.tag.pay{background:var(--card-2);color:var(--text-2)}
.tag.host{background:var(--active);color:var(--prussian)}
.tag.bnu{background:var(--navy);color:#fff}
.tag.ta,.tag.md{background:transparent;color:var(--prussian);border:1px solid var(--line)}
.dur{background:var(--card-2);color:var(--muted)}
:root[data-theme="dark"] .tag.host,:root[data-theme="dark"] .tag.ta,:root[data-theme="dark"] .tag.md{color:#bfd4ff}
:root[data-theme="dark"] .tag.bnu{background:rgba(62,126,255,.28);color:#dbe7ff}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tag.host,:root:not([data-theme="light"]) .tag.ta,:root:not([data-theme="light"]) .tag.md{color:#bfd4ff}
  :root:not([data-theme="light"]) .tag.bnu{background:rgba(62,126,255,.28);color:#dbe7ff}
}
.dayhead .tag{margin-left:auto}

/* các nhánh riêng trong một ngày */
.leg{margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px 18px;position:relative}
.leg::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--lc)}
.leg-head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:12px}
.leg-head h4{font-size:14px;color:var(--lc)}
.leg-head .who{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.leg-head .who .ic{width:12px;height:12px}
.leg .intro{margin-bottom:12px}
.leg.wall,.leg.gb{--lc:var(--prussian)} .leg.uni{--lc:var(--action)} .leg.home{--lc:var(--muted)}
:root[data-theme="dark"] .leg.wall,:root[data-theme="dark"] .leg.gb{--lc:#8fb3e6}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .leg.wall,:root:not([data-theme="light"]) .leg.gb{--lc:#8fb3e6} }

/* =====================================================================
   NGÂN SÁCH, CHUẨN BỊ, FOOTER
   ===================================================================== */
.levers{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-1);overflow:hidden}
.lever{display:grid;grid-template-columns:1fr auto;gap:20px;padding:14px 18px;border-bottom:1px solid var(--line-soft);align-items:center}
.lever:last-child{border-bottom:0}
.lever .save{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--success);background:rgba(34,197,94,.1);border-radius:99px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lever .save .ic{width:13px;height:13px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.panel{padding:20px 22px}
.panel h3{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:12px}
.panel h3 .sic{width:28px;height:28px}
.panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.panel li{position:relative;padding-left:16px}
.panel li::before{content:"";position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:99px;background:var(--turq)}

footer{margin-top:56px;padding:22px 24px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-2xl);font-size:12px;color:var(--muted);display:grid;grid-template-columns:72px 1fr;gap:18px;align-items:start}
footer .mascot{width:72px;height:auto;opacity:.9}
footer p + p{margin-top:8px}
footer ul{margin:12px 0 0;padding-left:16px;columns:2;column-gap:28px}
footer li{margin-bottom:4px;break-inside:avoid}
footer a{color:var(--muted)}
footer a:hover{color:var(--action)}

/* =====================================================================
   MOBILE FIRST < 1024px: header kính mờ ở trên, BottomBar ở dưới
   ===================================================================== */
@media (max-width:1023px){
  .side{position:sticky;top:0;inset:auto;width:auto;height:auto;flex-direction:column;gap:10px;padding:10px 16px 10px;
    background:var(--glass);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .brand .sub,.side-label,.side-nav,.side-foot{display:none}
  .brand img{height:18px}
  .side-top{flex-direction:row;align-items:center;gap:8px}
  .brand{flex:1}
  .m-actions{display:flex}
  .side-group.lang{flex:none}
  .side-group.lang .seg button{padding:6px 9px;font-size:12px}
  .people{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .people::-webkit-scrollbar{display:none}
  .people button{width:auto;flex:none;padding:6px 12px;border-radius:99px;background:var(--card-2);font-size:12px}
  .people button .ic{display:none}
  .main{margin-left:0}
  #app{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  section,.city,.day{scroll-margin-top:104px}

  .bbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--glass);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--muted);text-decoration:none;padding:5px 2px;border-radius:var(--r-lg);transition:color .15s,background .15s}
  .bbar a .ic{width:20px;height:20px}
  .bbar a.on{color:var(--heading);background:var(--active)}
  .bbar a.on .ic{color:var(--turq-ink)}
}

@media (max-width:640px){
  .hero-card{grid-template-columns:1fr;padding:24px 20px}
  .hero-mascot{display:none}
  .hero-card h1{font-size:20px;max-width:15ch}
  .day{grid-template-columns:1fr;gap:12px;padding:18px 16px}
  .daymark{position:static;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:8px;padding:5px 14px;justify-self:start;border-radius:99px}
  .dayhead .tag{margin-left:0}
  .daymark .dnum{font-size:16px}
  .daymark .ddow{margin-top:0}
  .slot{grid-template-columns:1fr;gap:0}
  .slot .t{padding:10px 0 0 20px;border-left:2px solid var(--line)}
  .slot:first-child .t{padding-top:0}
  .slot .a{padding-top:2px}
  .slot .a::before{top:-12px}
  .slot:first-child .a::before{top:-14px}
  .slot.move .t{padding:6px 0 0 20px;border-left:2px dashed var(--line)}
  .slot .a > b{display:block;margin-bottom:4px}
  .slot .a{overflow-wrap:anywhere}
  .tag,.dur{white-space:normal;margin-bottom:3px}
  .card,.panel,.track{padding:18px}
  .city-band .span{margin-left:0;width:100%}
  footer{grid-template-columns:1fr}
  footer ul{columns:1}
  figure.shot img{height:170px}
}

/* =====================================================================
   IN / XUẤT PDF: luôn in trên nền trắng, bỏ khung điều hướng
   ===================================================================== */
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    color-scheme:light;
    --bg:#fff; --card:#fff; --card-2:#f3f4f6; --active:#DCE8FF;
    --line:#e5e7eb; --line-soft:#f1f2f4;
    --heading:#18186b; --text:#111827; --text-2:#374151; --muted:#6b7280; --turq-ink:#0e7490;
    --warn-bg:#fffbeb; --warn-line:#fde68a; --warn-ink:#b45309; --info-bg:#f0f6ff; --info-line:#d5e3ff;
    --c-sh:#3E7EFF; --c-bj:#18186b; --c-tj:#234c87; --c-sz:#0e7490;
    --sh-1:none; --sh-2:none; --sh-3:none;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff!important}
  body{font-size:9pt;line-height:1.5}
  .side,.bbar{display:none!important}
  .main{margin:0}
  #app{max-width:none;padding:0}
  #app > *{animation:none}
  .hero-card{padding:16px 18px;box-shadow:none}
  .hero-card h1{font-size:16pt}
  .hero-mascot{width:90px}
  section{padding-top:16px}
  .city{padding-top:10px;break-before:page}
  #sh{break-before:auto}
  .day{padding:12px 14px;gap:14px;grid-template-columns:52px 1fr;margin-top:10px}
  .daymark{position:static}
  .slot{grid-template-columns:84px 1fr;gap:10px}
  .card,.panel,.track,.lever,.note,.slot,figure{break-inside:avoid}
  .day,.leg,.callout,.tablewrap,table,tbody{break-inside:auto}
  tr{break-inside:avoid}
  thead{display:table-header-group}
  .sec-head,.dayhead,.leg-head,.city-band,h2,h3,h4{break-after:avoid}
  figure.hero img{height:150px}
  figure.shot{max-width:300px}
  figure.shot img{height:135px}
  figure.hero figcaption{font-size:6.5pt}
  a{color:inherit}
  footer{margin-top:20px;grid-template-columns:1fr}
  footer .mascot{display:none}
  footer ul{columns:2;font-size:7.5pt}
  @page{margin:12mm 10mm}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}

   h:["Mỹ Duyên - về ngày 31/10 qua Thâm Quyến","My Duyen - home on 31 Oct via Shenzhen","美缘——10月31日经深圳回国"],
   n:["21/10 – 1/11 · 13 ngày","21 Oct – 1 Nov · 13 days","10月21日–11月1日 · 13天"],
   b:[["Ở lại thêm bốn ngày sau khi hai bạn kia về. Vé về <strong>cất cánh từ Thiên Tân chứ không phải Bắc Kinh</strong>: 31/10 lúc 07:55 từ Thiên Tân Tân Hải T2 đi Bảo An Thâm Quyến bằng Air China CA2813, hạ cánh 11:35. Quá cảnh qua đêm ở Thâm Quyến, rồi 1/11 lúc 08:30 bay ZH101 về Nội Bài lúc 09:40. Tổng tiền vé <strong>3.648.000 ₫</strong>.",
      "Stays four days longer than the other two. Her return <strong>departs from Tianjin, not Beijing</strong>: 31 Oct at 07:55 from Tianjin Binhai T2 to Shenzhen Bao'an on Air China CA2813, landing 11:35. An overnight connection in Shenzhen, then 1 Nov at 08:30 on ZH101 into Noi Bai at 09:40. Total fare <strong>3,648,000 VND</strong>.",
      "比另外两人多留四天。回程<strong>从天津起飞而不是北京</strong>：10月31日07:55从天津滨海T2飞深圳宝安，国航CA2813，11:35落地。在深圳过夜中转，11月1日08:30乘ZH101，09:40抵达内排。票款合计<strong>364.8万越南盾</strong>。"],
     ["Bốn ngày cuối đi theo lộ trình Mỹ Duyên tự lập. <strong>28/10 ở Bắc Kinh</strong>: Thanh Hoa, khu nghệ thuật 798, Bảo tàng Điện ảnh Trung Quốc. <strong>29/10 sang Thiên Tân</strong> bằng tàu cao tốc 33 phút, chiều đi Ngũ Đại Đạo, Giải Phóng Bắc Lộ và khu phố kiểu Ý. <strong>30/10 trọn ngày ở Thiên Tân</strong>: Thư viện Tân Hải và Nhà Sứ. <strong>31/10 bay xuống Thâm Quyến</strong>, cả buổi chiều và tối ở Cửa sổ Thế giới, đúng dịp Halloween.",
      "The last four days follow My Duyen's own plan. <strong>28 Oct in Beijing</strong>: Tsinghua, the 798 Art Zone, the China National Film Museum. <strong>29 Oct to Tianjin</strong> on the 33-minute high-speed train, with the Five Great Avenues, Jiefang North Road and the Italian quarter in the afternoon. <strong>30 Oct is a full Tianjin day</strong>: the Binhai Library and the Porcelain House. <strong>31 Oct flies down to Shenzhen</strong>, with the whole afternoon and evening at Window of the World, on Halloween itself.",
      "最后四天按美缘自己的计划走。<strong>10月28日在北京</strong>：清华、798艺术区、中国电影博物馆。<strong>10月29日乘33分钟高铁到天津</strong>，下午五大道、解放北路和意式风情区。<strong>10月30日在天津待一整天</strong>：滨海图书馆和瓷房子。<strong>10月31日南下深圳</strong>，整个下午和晚上都在世界之窗，正逢万圣夜。"],
     ["Hai điều bắt buộc phải xử lý. Một, <strong>phải ngủ ở Thiên Tân hai đêm 29 và 30/10</strong> - chuyến tàu cao tốc sớm nhất từ Bắc Kinh sang Thiên Tân cũng không kịp cho chuyến bay 07:55, nên không có phương án nào đi từ Bắc Kinh trong buổi sáng. Hai, <strong>chặng Thâm Quyến qua đêm phải lấy hành lý ra và ký gửi lại sáng hôm sau</strong>, khác hẳn chặng quá cảnh Thượng Hải lượt đi.",
      "Two things that have to be handled. One, <strong>two nights in Tianjin, 29 and 30 Oct</strong> - even the first high-speed train from Beijing is too late for an 07:55 departure, so no morning option from Beijing works. Two, <strong>the overnight Shenzhen connection means reclaiming the checked bag and rechecking it the next morning</strong>, unlike the Shanghai layover on the way out.",
      "有两件事必须处理。第一，<strong>10月29日和30日两晚都要住在天津</strong>——即便是从北京出发的首班高铁也赶不上07:55的航班，所以从北京出发的早班方案没有一个来得及。第二，<strong>深圳过夜中转须取出托运行李并于次日上午重新托运</strong>，与去程上海中转完全不同。"]] }

       d:['<span class="han">圆明园路</span>——dãy phố Rockbund ngay sau lưng Bến Thượng Hải, gồm khoảng mười toà nhà thương mại đầu thế kỷ 20 đã được trùng tu, cùng <span class="han">协进堂</span> Nhà thờ Hiệp Tiến xây năm 1886. Phố đi bộ, ít xe, kiến trúc dày đặc - đây là đoạn cho ảnh đẹp nhất trong ngày mà lại vắng hơn Bến Thượng Hải.',
          '<span class="han">圆明园路</span> - the Rockbund strip directly behind the Bund: about ten restored early-twentieth-century commercial buildings plus <span class="han">协进堂</span> Union Church of 1886. Pedestrianised, little traffic, dense architecture - the best stretch of the day for photographs and quieter than the Bund itself.',

       d:['<span class="han">南京东路</span>——phố đi bộ nối thẳng từ Bến Thượng Hải vào trung tâm, 1,2 km, có tàu điện nhỏ chạy dọc phố. Ăn trưa ở đây là hợp lý vì cả buổi sáng chưa dừng ăn: tiểu long bao và sinh tiễn bao là đặc sản riêng của Thượng Hải, tìm quán trong các ngõ cắt ngang thay vì mặt phố lớn thì rẻ hơn nhiều. Ăn xong còn khoảng 40 phút đi bộ và chụp ảnh.',
          '<span class="han">南京东路</span> - the pedestrian street running from the Bund into the centre, 1.2 km, with a small tram along it. Lunch belongs here because the morning had no stop for it: xiaolongbao and shengjianbao are Shanghai specialities, and the side lanes are much cheaper than the main frontage. That leaves about 40 minutes to walk and photograph.',

      {t:["16:00–17:30","16:00–17:30","16:00–17:30"], b:["Lục Gia Chủy, dưới chân tháp Đông Phương Minh Châu","Lujiazui, under the Oriental Pearl Tower","陆家嘴，东方明珠脚下"], tag:"free", dur:["90 phút","90 min","90分钟"],
       d:["Điểm cuối và cũng là điểm đáng dừng lâu nhất: 35 phút ở chân tháp, 35 phút trên cầu đi bộ vòng tròn Lục Gia Chủy - đây là góc ngước lên tháp mà ai cũng nhận ra - phần còn lại nghỉ chân. Mặt trời lặn khoảng 17:05 nên đúng khung này ánh nắng xiên vàng lên mặt kính các toà tháp, và tới 17:30 thì đèn bắt đầu bật. Không cần mua vé lên tháp, góc đẹp nhất là từ dưới đất và từ cầu vòng.",

   {p:["gb","md"], m:1, t:["45 phút","45 min","45分钟"], a:['Sa Hà → tuyến Xương Bình → đổi tuyến 8 tại <span class="han">朱辛庄</span> → ga Olympic Green · 6 CNY',

    d:["Diễn đàn kết thúc 18:30 nên tới nơi khoảng 19:30. Tổ Chim và Thuỷ Lập Phương lên đèn buổi tối, quảng trường rộng, đi bộ thoải mái. Đây là điểm tối gần trường nhất và cũng dễ về nhất - tuyến 8 nối thẳng vào tuyến Xương Bình.",

   {p:["gb","md"], m:1, t:["45 phút","45 min","45分钟"], a:["Về Sa Hà bằng đúng đường cũ","Back to Shahe the same way","原路返回沙河"]}
  ],
  notes:[["<b>Giờ tàu cuối:</b> tuyến Xương Bình từ Zhuxinzhuang về Sa Hà dừng chạy khoảng 23:00. Cứ đặt luật cho cả nhóm là <b>rời trung tâm trước 21:30</b>, và kiểm tra lại giờ thực tế trên app Amap trước khi đi. Lỡ chuyến cuối thì Didi từ trung tâm về Xương Bình mất khoảng 120–150 CNY.",
   "<b>Last trains:</b> the Changping Line from Zhuxinzhuang to Shahe stops around 23:00. Make it a team rule to <b>leave the centre before 21:30</b>, and check the real times in Amap on the day. Missing it means a CNY 120–150 Didi back to Changping.",
   "<b>末班车：</b>昌平线从朱辛庄回沙河约23:00停运。给全队定个规矩：<b>21:30前离开市区</b>，当天用高德查实际时间。错过末班车，从市区打滴滴回昌平约120–150元。"]]

{ city:"bj", n:"24", dow:"T7",
  head:["Mentoring cả ngày · Thập Sát Hải ban đêm","Mentoring all day · Shichahai at night","全天赛前辅导 · 夜游什刹海"], hosttag:1,
  slots:[
   {t:["09:00–19:00","09:00–19:00","09:00–19:00"], b:["Mentoring trước vòng thi","Pre-competition Mentoring","赛前辅导"], tag:"bnu", dur:["10 giờ","10h","10小时"],
    d:["Ice-breaking Activity, Project Optimization và Advancement Mentoring. Ngày dài nhất của chương trình: mang sẵn laptop, sạc dự phòng và bản dự án mới nhất, ghi lại góp ý của mentor để sửa ngay trong tối nay hoặc sáng mai.",
       "Ice-breaking Activity, Project Optimization and Advancement Mentoring. The longest day of the programme: bring laptops, power banks and the latest version of the project, and write down the mentors' feedback to act on tonight or tomorrow morning.",
       "破冰活动（Ice-breaking）、项目优化（Project Optimization）与进阶辅导（Advancement Mentoring）。这是日程中最长的一天：带好笔记本电脑、充电宝和最新版项目，记下导师意见，当晚或次日上午就改。"]},
   {p:["ta"], t:["Tối","Evening","晚上"], b:["Nghỉ tại campus","Evening on campus","晚上留在校区"],
    d:["Ăn tối ở căng tin, nghỉ sớm cho ngày Roadshow.","Dinner at the canteen, early night before Roadshow day.","在食堂吃晚饭，早点休息，迎接路演日。"]},
   {p:["gb","md"], m:1, t:["55 phút","55 min","55分钟"], a:['Sa Hà → tuyến Xương Bình → tuyến 8 tại Zhuxinzhuang → ga <span class="han">南锣鼓巷</span> Nanluoguxiang · 6 CNY',
    'Shahe → Changping Line → Line 8 at Zhuxinzhuang → <span class="han">南锣鼓巷</span> Nanluoguxiang · CNY 6',
    '沙河 → 昌平线 → 朱辛庄换8号线 → <span class="han">南锣鼓巷</span>站 · 6元']},
   {p:["gb","md"], t:["20:00–21:20","20:00–21:20","20:00–21:20"], b:["Nam La Cổ Hạng & Thập Sát Hải","Nanluoguxiang & Shichahai","南锣鼓巷 & 什刹海"], tag:"free", dur:["80 phút","80 min","80分钟"],
    d:["Mentoring kết thúc 19:00 nên buổi tối ngắn hơn: đi nhanh qua ngõ hutong Nam La Cổ Hạng, sang hồ Thập Sát Hải ăn tối và dạo ven hồ. Đèn lồng ven hồ, Tháp Chuông và Tháp Trống ngay gần đó. <strong>Buổi này tuỳ sức</strong>: nếu cả nhóm đã mệt sau 10 tiếng mentoring hoặc còn phải sửa dự án, cứ ăn ở campus và để dành sức cho Roadshow ngày mai.",
       "Mentoring ends at 19:00, so the evening is shorter: a quick walk through the Nanluoguxiang hutongs, then on to Shichahai for dinner and a stroll by the lake. Lanterns along the water, the Bell and Drum Towers nearby. <strong>This one is optional</strong>: if the group is tired after ten hours of mentoring or still has project fixes to make, eat on campus and save your energy for tomorrow's Roadshow.",
       "辅导19:00结束，所以晚上时间较短：快速走过南锣鼓巷胡同，再到什刹海吃晚饭、绕湖散步。湖边灯笼，钟鼓楼就在附近。<strong>这一项视体力而定</strong>：若十小时辅导后已很累或还要改项目，就在校区吃饭，把精力留给明天的路演。"]},
   {p:["gb","md"], m:1, t:["55 phút","55 min","55分钟"], a:["Về Sa Hà - xuất phát muộn nhất 21:30","Back to Shahe - leave by 21:30 at the latest","返回沙河——最晚21:30出发"]}
  ]},

{ city:"bj", n:"25", dow:"CN",
  head:["Roadshow · Bế mạc & trao giải · Tiền Môn ban đêm","Roadshow · Closing & awards · Qianmen at night","路演 · 闭幕颁奖 · 夜游前门"], hosttag:1,
  slots:[
   {t:["09:00–12:00","09:00–12:00","09:00–12:00"], b:["Mentoring trước vòng thi","Pre-competition Mentoring","赛前辅导"], tag:"bnu", dur:["3 giờ","3h","3小时"],
    d:["Buổi góp ý cuối cùng trước khi lên Roadshow. Chốt bản trình bày trong buổi này, đừng sửa thêm sau giờ trưa.",
       "The last round of feedback before the Roadshow. Lock the pitch in this session; no more changes after lunch.",
       "路演前最后一轮辅导。在这一场定稿，午饭后不再修改。"]},
   {t:["13:30–16:00","13:30–16:00","13:30–16:00"], b:["Đánh giá dự án (Roadshow)","Project Evaluation (Roadshow)","项目评审（路演）"], tag:"bnu", dur:["150 phút","150 min","150分钟"],
    d:["Phần thi chính của đội. Tranh thủ giờ nghỉ trưa 12:00–13:30 để ăn nhẹ và chạy thử lần cuối, kiểm tra file trình chiếu trên máy của BTC nếu được.",
       "The team's main event. Use the 12:00–13:30 lunch break for a light meal and one last run-through, and test the slides on the organisers' machine if you can.",
       "这是全队的正式比赛环节。利用12:00–13:30午休简单吃点并最后演练一遍，可以的话在主办方电脑上测试演示文件。"]},
   {t:["16:00–17:30","16:00–17:30","16:00–17:30"], b:["Tham quan campus & chụp ảnh","Campus Tour & Photo Session","参观校园与合影"], tag:"bnu", dur:["90 phút","90 min","90分钟"],
    d:["Dịp chụp ảnh chung cả đội ở BNU - mặc đồng phục đội nếu có.","The chance for a full-team photo at BNU - wear team shirts if you have them.","在北师大拍全队合影的机会——有队服就穿上。"]},
   {t:["17:30–18:30","17:30–18:30","17:30–18:30"], b:["Bế mạc & trao giải","Closing Ceremony & Awarding","闭幕式与颁奖"], tag:"bnu", dur:["60 phút","60 min","60分钟"],
    d:["Cả 4 người. Kết thúc chương trình chính thức.","All four. The end of the official programme.","四人全体。正式日程结束。"]},
   {p:["ta"], t:["Tối","Evening","晚上"], b:["Ăn tối cùng nhóm hoặc thu dọn hành lý","Dinner with the group, or packing","与大家晚餐或收拾行李"],
    d:["Nếu còn sức thì đi cùng cả nhóm ra Tiền Môn ăn tối mừng kết thúc cuộc thi - bữa cuối của cả bốn người. Nếu không thì nghỉ ở campus và thu dọn hành lý cho chuyến bay ngày 26/10.",
       "If you have the energy, join the group at Qianmen for the end-of-competition dinner - the last meal with all four. Otherwise rest on campus and pack for the 26 Oct flight.",
       "有精力的话就和大家一起去前门吃庆功晚餐——四人在一起的最后一餐。否则就留在校区休息，为10月26日的航班收拾行李。"]},
   {p:["gb","md"], m:1, t:["65 phút","65 min","65分钟"], a:['Sa Hà → tuyến Xương Bình → tuyến 8 tại Zhuxinzhuang → ga <span class="han">前门</span> Qianmen · 7 CNY',
    'Shahe → Changping Line → Line 8 at Zhuxinzhuang → <span class="han">前门</span> Qianmen · CNY 7',
    '沙河 → 昌平线 → 朱辛庄换8号线 → <span class="han">前门</span>站 · 7元']},
   {p:["gb","md"], t:["19:40–21:15","19:40–21:15","19:40–21:15"], b:["Phố Tiền Môn & ngõ Đại Sách Lan","Qianmen Street & Dashilan","前门大街 & 大栅栏"], tag:"free", dur:["95 phút","95 min","95分钟"],
    d:["Bế mạc xong lúc 18:30 nên tới nơi khoảng 19:40. Khoảng 60 phút ăn tối mừng kết thúc cuộc thi, 30 phút đi bộ. Phố đi bộ kiểu cũ có tàu điện leng keng, nhìn thẳng lên Chính Dương Môn và rìa Quảng trường Thiên An Môn lên đèn. Vịt quay Tiện Nghi Phường hoặc Toàn Tụ Đức đều nằm trong khu này - một con vịt cho cả nhóm khoảng 75–100 CNY mỗi người. Đây cũng là bữa cuối cùng của cả bốn người trước khi Tuấn Anh về sáng hôm sau.",
       "The closing ends at 18:30, so you arrive around 19:40. About 60 minutes for a celebration dinner and 30 minutes walking. An old-style pedestrian street with a clanging tram, looking straight up at Zhengyangmen and the lit edge of Tiananmen Square. Bianyifang or Quanjude roast duck are both here - one duck for the group is CNY 75–100 a head. It is also the last meal with all four together, since Tuan Anh flies home the next day.",
       "闭幕式18:30结束，约19:40到达。约60分钟庆功晚餐，30分钟步行。仿古步行街有叮当作响的电车，正对正阳门和灯火中的天安门广场边缘。便宜坊和全聚德烤鸭都在这一带——全队一只鸭，人均75–100元。这也是四人在一起的最后一餐，因为俊英第二天就回国。"]},
   {p:["gb","md"], m:1, t:["65 phút","65 min","65分钟"], a:["Về Sa Hà - xuất phát muộn nhất 21:15 vì đây là chặng xa nhất","Back to Shahe - leave by 21:15, this is the longest ride","返回沙河——最晚21:15出发，这是最远的一段"]}
  ],
  notes:[["<b>Xác nhận với BTC:</b> ăn ở do BNU bao kết thúc vào tối 25/10 hay sáng 26/10. Trả lời khác nhau lệch mất một đêm khách sạn và có thể lệch cả bữa sáng của Tuấn Anh trước khi ra sân bay.",
   "<b>Confirm with the organisers:</b> does BNU's board and lodging end on the evening of 25 Oct or the morning of 26 Oct? The answer is worth a hotel night, and possibly Tuan Anh's breakfast before the airport.",
   "<b>向主办方确认：</b>北师大的食宿到10月25日晚结束还是10月26日早上？答案关系到一晚酒店，也可能关系到俊英去机场前的早餐。"]]
}
);

{ city:"bj", n:"26", dow:"T2", icon:"g-wall",
  head:["Ngày cả đội tách làm ba hướng","The day the team splits three ways","全队分三路的一天"],
  intro:["Hôm nay là <strong>thứ hai - Cố Cung đóng cửa</strong>, nên đây đúng là ngày để đi Trường Thành và Universal. Cả ba rời BNU cùng lúc 7:30 rồi đi ba hướng khác nhau, và tối gặp lại nhau ở khách sạn Thông Châu.",
   "Today is <strong>Monday - the Forbidden City is closed</strong>, which makes it exactly the right day for the Great Wall and Universal. All three leave BNU together at 07:30, go three separate ways, and meet again in the evening at the hotel in Tongzhou.",
   "今天是<strong>周一——故宫闭馆</strong>，正好适合去长城和环球影城。三人7:30一同离开北师大，分三路行动，晚上在通州的酒店会合。"],
  legs:[
   { cls:"wall", p:["gb"], h:["Trường Thành, rồi khu đại học Hải Điến","The Great Wall, then the Haidian university district","长城，然后海淀高校区"], who:["Gia Bảo + Quỳnh Mai","Gia Bao + Quynh Mai","嘉宝 + 琼梅"],
     intro:["Chọn Bát Đạt Lĩnh vì từ Xương Bình có tàu cao tốc lên thẳng. Và vì tàu về dừng ở ga Thanh Hà - cách khu đại học Hải Điến đúng hai ga tàu - nên buổi chiều ghép được cả hai cổng trường lẫn Viên Minh Viên mà gần như không tốn thêm đường đi. Kế hoạch dưới đây <strong>không phụ thuộc vào việc xin được suất vào trong trường</strong>: chỉ chụp ảnh ở cổng ngoài, rồi dành phần lớn thời gian cho Viên Minh Viên, nơi ai cũng mua vé vào được.",
      "Badaling because there is a direct high-speed train from Changping. And because the train back stops at Qinghe - two stops from the Haidian university district - the afternoon can take in both university gates and the Old Summer Palace at almost no extra travel. The plan below <strong>does not depend on securing a campus visit slot</strong>: photographs at the outer gates, then most of the time at the Old Summer Palace, which anyone can buy a ticket for.",

     slots:[

      {m:1, t:["40 phút","40 min","40分钟"], a:['Sa Hà → tuyến Xương Bình → đổi tuyến 13 → ga <span class="han">清河</span> Thanh Hà · 5 CNY',

          "About CNY 20–30 a locker. Do not carry suitcases up the Wall - and the campus visits in the afternoon need free hands too.",

        'Line 13 from Qinghe, two stops, to <span class="han">五道口</span> Wudaokou · CNY 3',
        '13号线从清河两站至<span class="han">五道口</span> · 3元']},
      {m:1, t:["15 phút","15 min","15分钟"], a:["Đi bộ hoặc thuê xe đạp chung từ Wudaokou về phía tây theo đường Thanh Hoa Tây · 1,5 km",
        "Walk or grab a shared bike west from Wudaokou along Qinghua West Road · 1.5 km",
        "从五道口步行或扫共享单车沿清华西路向西 · 1.5公里"]},
      {t:["14:30–15:00","14:30–15:00","14:30–15:00"], b:["Cổng Tây Đại học Thanh Hoa","Tsinghua University West Gate","清华大学西门"], tag:"free", dur:["30 phút","30 min","30分钟"],
       d:['<span class="han">清华大学西门</span> - cổng đá trắng có biển <span class="han">清华大学</span>, nằm ngay mặt đường nên <strong>chụp ảnh từ bên ngoài không cần vé hay đặt chỗ</strong>. Đây cũng chính là chỗ người ta xếp hàng chụp ảnh hằng ngày. Lưu ý thành thật: <span class="han">二校门</span> Nhị Hiệu Môn - cổng đá trắng nổi tiếng hơn - nằm sâu khoảng 500m bên trong khuôn viên, không vào thì không thấy được.',
          '<span class="han">清华大学西门</span> - the white stone gate with the <span class="han">清华大学</span> plaque, right on the street, so <strong>photographing it from outside needs no ticket and no reservation</strong>. This is where people queue for the shot every day. One honest caveat: <span class="han">二校门</span>, the more famous white gate, stands about 500m inside the campus and cannot be seen without entering.',
          '<span class="han">清华大学西门</span> - 带<span class="han">清华大学</span>校名牌匾的白色石门，就在马路边，<strong>从校外拍照无需门票或预约</strong>。每天都有人在此排队拍照。需如实说明：更有名的<span class="han">二校门</span>在校园内约500米处，不入校看不到。']},
      {m:1, t:["10 phút","10 min","10分钟"], a:["Đi bộ xuống phía nam sang đường Di Hoà Viên, tới cổng Tây Bắc Đại",
        "Walk south onto Yiheyuan Road to Peking University's West Gate",
        "向南步行至颐和园路，到北京大学西门"]},
      {t:["15:10–15:40","15:10–15:40","15:10–15:40"], b:["Cổng Tây Đại học Bắc Kinh","Peking University West Gate","北京大学西门"], tag:"free", dur:["30 phút","30 min","30分钟"],
       d:['<span class="han">北京大学西门</span> - may hơn Thanh Hoa: cổng nổi tiếng nhất của Bắc Đại lại chính là cổng ngoài, kiểu cung đình mái ngói đỏ có đôi sư tử đá, biển chữ <span class="han">北京大学</span> do Mao Trạch Đông viết. Đứng ngoài chụp thoải mái. Hồ Vị Danh và tháp Bác Nhã thì ở bên trong, chỉ xem được nếu vào.',
          '<span class="han">北京大学西门</span> - luckier than Tsinghua: PKU\'s most famous gate is the outer one, a palace-style gate with red tiles and a pair of stone lions, the <span class="han">北京大学</span> plaque in Mao Zedong\'s hand. Photograph it freely from the street. Weiming Lake and Boya Pagoda are inside and need entry.',
          '<span class="han">北京大学西门</span> - 比清华幸运：北大最有名的校门正是外面这座，宫殿式红瓦、一对石狮，<span class="han">北京大学</span>匾额为毛泽东题写。在街边随意拍照。未名湖和博雅塔在校内，须入校才能看。']},
      {m:1, t:["6 phút","6 min","6分钟"], a:['Đi bộ ngược lên phía bắc qua đường, tới cổng nam Viên Minh Viên <span class="han">绮春园宫门</span>',
        'Walk back north across the road to the Old Summer Palace south gate <span class="han">绮春园宫门</span>',
        '向北过马路到圆明园南门<span class="han">绮春园宫门</span>']},
      {t:["15:45–17:10","15:45–17:10","15:45–17:10"], b:["Viên Minh Viên","The Old Summer Palace","圆明园"], tag:"pay", tagx:["10 + 15 CNY","CNY 10 + 15","10 + 15元"], dur:["85 phút","85 min","85分钟"],
       d:['<span class="han">圆明园</span> - cung điện mùa hè cũ của nhà Thanh, bị liên quân Anh–Pháp đốt năm 1860 và để nguyên dạng phế tích từ đó. Đây là điểm <strong>ai cũng vào được, chỉ cần hộ chiếu và 10 CNY</strong>, không đặt chỗ, không cần quen ai - nên nó gánh phần lớn buổi chiều. Vé vào vườn 10 CNY, thêm 15 CNY cho khu <span class="han">西洋楼</span> Tây Dương Lâu, nơi có nền đá chạm trổ kiểu baroque của <span class="han">大水法</span> - bức ảnh mà ai cũng nhận ra. Cuối tháng 10 lá vàng và đỏ quanh hồ. Nên dành 55 phút cho khu phế tích, 30 phút đi bộ ven hồ về cổng.',
          '<span class="han">圆明园</span> - the Qing dynasty\'s old summer palace, burnt by Anglo-French troops in 1860 and left as ruins ever since. <strong>Anyone can enter with a passport and CNY 10</strong> - no reservation, no contacts needed - so it carries most of the afternoon. Garden entry is CNY 10, plus CNY 15 for the <span class="han">西洋楼</span> Western Mansions, where the carved baroque stonework of <span class="han">大水法</span> stands - the photograph everyone recognises. Late October brings yellow and red around the lakes. Give 55 minutes to the ruins and 30 walking back along the water.',
          '<span class="han">圆明园</span> - 清代的旧夏宫，1860年被英法联军焚毁，此后保留废墟原貌。<strong>凭护照花10元人人可进</strong>——无需预约，也不需要熟人——所以它承担了下午的大部分时间。园门票10元，<span class="han">西洋楼</span>遗址区另加15元，那里有<span class="han">大水法</span>的巴洛克式雕花石构——最有辨识度的一张照片。10月下旬湖畔黄红交映。建议遗址区55分钟，沿湖步行返回30分钟。']},
      {m:1, t:["25 phút","25 min","25分钟"], a:["Đi bộ hoặc xe đạp chung quay lại ga Wudaokou","Walk or ride a shared bike back to Wudaokou station","步行或骑共享单车返回五道口站"]},
      {m:1, t:["25 phút","25 min","25分钟"], a:["Tuyến 13 hai ga về ga Thanh Hà, lấy hành lý ở tủ · 3 CNY","Line 13 two stops back to Qinghe, collect the luggage · CNY 3","13号线两站回清河站取行李 · 3元"]},
      {m:1, t:["100 phút","100 min","100分钟"], a:['Tuyến 13 → đổi tuyến 10 tại <span class="han">知春路</span> → đổi tuyến 1 tại <span class="han">国贸</span> → ga <span class="han">梨园</span> Lê Viên · 7 CNY · đây là chặng dài nhất trong ngày, cái giá của việc ở Thông Châu',
        'Line 13 → change to Line 10 at <span class="han">知春路</span> Zhichunlu → change to Line 1 at <span class="han">国贸</span> Guomao → <span class="han">梨园</span> Liyuan · CNY 7 · the longest ride of the day, the price of staying in Tongzhou',
        '13号线 → <span class="han">知春路</span>换10号线 → <span class="han">国贸</span>换1号线 → <span class="han">梨园</span>站 · 7元 · 全天最长的一段，住通州的代价']},
      {t:["19:45–20:15","19:45–20:15","19:45–20:15"], b:["Nhận phòng khách sạn Thông Châu","Check in at the Tongzhou hotel","入住通州酒店"], dur:["30 phút","30 min","30分钟"],
       d:["Khách sạn cách ga Lê Viên khoảng 350m nên xuống tàu là tới. Nếu muốn về sớm hơn thì rút ngắn Viên Minh Viên khoảng 30 phút.",
          "The hotel is about 350m from Liyuan station, so it is a short walk from the train. To get back earlier, trim about 30 minutes off the Old Summer Palace.",
          "酒店距梨园站约350米，下车即到。想早点回来，可把圆明园的时间压缩约30分钟。"]},
      {t:["20:30–21:30","20:30–21:30","20:30–21:30"], b:["Ăn tối gần khách sạn cùng Mỹ Duyên","Dinner near the hotel with My Duyen","与美缘在酒店附近吃晚饭"], dur:["60 phút","60 min","60分钟"],
       d:["Hôm nay đi bộ nhiều và leo Trường Thành, nên ăn gần rồi về phòng sớm. Mỹ Duyên rời công viên lúc 20:00 và về tới khoảng 20:25. Muốn xem khu cổng Universal thì đổi thành ăn ở CityWalk, cách bốn ga tàu và mở tới 21:30, nhưng sẽ về muộn hơn khoảng 40 phút.",
          "A long day with the Wall in it, so eat nearby and get to bed. My Duyen leaves the park at 20:00 and is back around 20:25. To see the area by the Universal gate instead, eat at CityWalk, four stops away and open until 21:30, though that gets you back about 40 minutes later.",
          "今天走了很多路还爬了长城，就近吃完早点回房。美缘20:00出园，约20:25到。若想看看环球影城门口一带，可改在城市大道用餐，四站地铁、开到21:30，但会晚回约40分钟。"]}
     ]},
   { cls:"uni", p:["md"], h:["Universal Beijing Resort","Universal Beijing Resort","北京环球影城"], who:["Mỹ Duyên","My Duyen","美缘"],
     intro:["Cả ngày ở công viên, và cái quyết định duy nhất thật sự quan trọng là <strong>có mặt đúng giờ mở cửa</strong>. Từ campus Xương Bình ra tới cổng Universal là quãng đường dài nhất trong cả chuyến đi Bắc Kinh - gần 60 km, xuyên từ tây bắc xuống đông nam - nên giờ khởi hành phải tính ngược từ giờ mở cổng chứ không phải từ giờ ngủ dậy.",
      "A whole day in the park, and the one decision that really matters is <strong>being there when it opens</strong>. Changping campus to the Universal gate is the longest journey of the entire Beijing stay - nearly 60 km from the north-west to the south-east - so the departure time has to be worked backwards from the gate, not forwards from waking up.",
      "在园区待一整天，唯一真正重要的决定是<strong>开门就到</strong>。从昌平校区到环球影城门口是整个北京行程中最长的一段——近60公里，从西北穿到东南——所以出发时间要从开园时间倒推，而不是从起床时间往后算。"],
     slots:[
      {t:["06:20–07:00","06:20–07:00","06:20–07:00"], b:["Dậy, ăn sáng, trả phòng BNU","Up, breakfast, check out of BNU","起床、早餐、退宿舍"], dur:["40 phút","40 min","40分钟"],
       d:["Trả phòng cùng cả nhóm nhưng đi sớm hơn hai bạn kia khoảng 30 phút, vì chặng đường của bạn dài hơn hẳn.",
          "Check out with the group but leave about 30 minutes ahead of the other two, because your journey is much the longer one.",
          "和大家一起退房，但比另外两人早约30分钟出发，因为你的路程长得多。"]},
      {m:1, t:["75–85 phút","75–85 min","75–85分钟"], a:["Didi từ campus Xương Bình thẳng tới cổng Universal · 58 km · 200–250 CNY · đặt xe từ tối hôm trước cho khung 07:00",
        "A Didi from the Changping campus straight to the Universal gate · 58 km · CNY 200–250 · pre-book it the night before for 07:00",
        "从昌平校区打滴滴直达环球影城门口 · 58公里 · 200–250元 · 前一晚就预约07:00的车"]},
      {t:["Rẻ hơn","Cheaper","更省"], b:["Hoặc đi metro, nhưng phải dậy sớm hơn 45 phút","Or the metro, but 45 minutes earlier out of bed","或坐地铁，但要早起45分钟"], dur:["120 phút","120 min","120分钟"],
       d:['Sa Hà → tuyến Xương Bình → tuyến 8 tại <span class="han">朱辛庄</span> → đổi tuyến 1 tại <span class="han">王府井</span> → đi thẳng tới ga cuối <span class="han">环球度假区</span> · 8 CNY. Khoảng 2 tiếng, tức phải rời BNU lúc <strong>06:15</strong> mới có mặt lúc 08:20. Rẻ hơn khoảng 200 CNY. Ở ga cuối nên đứng toa số 15 để ra thẳng thang cuốn cửa B, sát ngay cổng an ninh.',
          'Shahe → Changping Line → Line 8 at <span class="han">朱辛庄</span> Zhuxinzhuang → change to Line 1 at <span class="han">王府井</span> Wangfujing → ride to the terminus <span class="han">环球度假区</span> · CNY 8. About two hours, so leaving BNU at <strong>06:15</strong> to be there by 08:20. Saves roughly CNY 200. At the terminus, stand in car 15 to come out at the exit B escalator, right by security.',
          '沙河 → 昌平线 → <span class="han">朱辛庄</span>换8号线 → <span class="han">王府井</span>换1号线 → 坐到终点<span class="han">环球度假区</span> · 8元。约两小时，也就是要<strong>06:15</strong>离开北师大才能08:20到。省约200元。到终点站时站第15节车厢，出站直达B口扶梯，紧邻安检。']},
      {t:["08:30","08:30","08:30"], b:["Có mặt ở cổng Universal Beijing","At the Universal Beijing gate","抵达北京环球影城门口"],
       d:["Gửi vali ngay trong công viên, 90 CNY một kiện lớn cả ngày - đừng kéo vali đi chơi. Xếp hàng an ninh trước giờ mở cổng khoảng 30 phút là vừa.",
          "Store the suitcase inside the park, CNY 90 for a large bag all day - do not drag it around. Being in the security queue about 30 minutes before opening is right.",
          "行李箱存在园内，大件全天90元——别拖着到处走。开园前约30分钟排进安检队伍正合适。"]},
      {t:["09:00–20:00","09:00–20:00","09:00–20:00"], b:["Universal Beijing Resort","Universal Beijing Resort","北京环球影城"], tag:"pay", tagx:["418–528 CNY","CNY 418–528","418–528元"], dur:["11 tiếng","11 hours","11小时"],
       d:["<strong>Kiểm tra giờ mở cửa trên app trước một tuần:</strong> công viên mở 9:00 vào ngày cao điểm nhưng 10:00 vào ngày thường mùa thấp điểm, và 26/10 là thứ hai cuối tháng 10. Nếu app ghi 10:00 thì lùi toàn bộ buổi sáng lại một tiếng, đỡ phải dậy lúc 6:20. Giờ đầu tiên trong ngày là lúc vắng nhất, đáng giá hơn bất cứ mẹo xếp hàng nào. Giá vé thay đổi theo ngày, tra lịch giá 90 ngày trên app trước khi đặt.",
          "<strong>Check the opening time in the app a week ahead:</strong> the park opens at 09:00 on peak days but 10:00 on low-season weekdays, and 26 Oct is a late-October Monday. If the app says 10:00, push the whole morning back an hour and skip the 06:20 alarm. The first hour is the emptiest and beats any queueing trick. Prices vary by date; check the 90-day price calendar in the app before booking.",
          "<strong>提前一周在App里确认开园时间：</strong>旺季9:00开园，淡季工作日10:00，而10月26日是10月下旬的周一。若App显示10:00，整个上午就往后推一小时，也不用6:20起床。第一个小时人最少，胜过任何排队技巧。票价按日浮动，订票前先看App里的90天价格日历。"]},
      {t:["Cân nhắc","Optional","可选"], b:["Express Pass","Express Pass","优速通"], tag:"pay", tagx:["từ 900 CNY","from CNY 900","900元起"],
       d:["Thứ hai cuối tháng 10 là ngày thường mùa thấp điểm nên hàng chờ vốn đã dễ thở, và hàng <em>Single Rider</em> - lợi thế thật sự khi đi một mình - đã giải quyết được phần lớn các trò lớn. Nếu vẫn muốn chắc chắn chơi hết mọi thứ trong 11 tiếng thì Express Pass là cách mua thời gian.",
          "A Monday in late October is a low-season weekday, so the queues are already manageable, and the <em>Single Rider</em> lines - the real advantage of going alone - cover most of the big rides. If you want certainty of doing everything in eleven hours, Express Pass is how you buy time.",
          "10月下旬的周一是淡季工作日，排队本就不算长，而<em>单人排队通道</em>——独自前往的真正优势——已能解决大部分大型项目。若想确保十一小时内玩遍所有项目，优速通就是花钱买时间。"]},
      {t:["20:00–20:30","20:00–20:30","20:00–20:30"], b:['CityWalk <span class="han">城市大道</span>','CityWalk <span class="han">城市大道</span>','城市大道 CityWalk'], tag:"free", dur:["30 phút","30 min","30分钟"],
       d:["Khu ăn uống ngay cổng công viên, mở tới 21:30, không cần vé. Lấy vali ở quầy gửi đồ rồi mua đồ lưu niệm trước khi về.",
          "The dining strip right at the park gate, open to 21:30, no ticket needed. Collect the suitcase from storage and grab souvenirs before heading in.",
          "园区门口的餐饮街，开到21:30，无需门票。取回行李箱，买点纪念品再走。"]},
      {m:1, t:["25 phút","25 min","25分钟"], a:['Tuyến 1 đi bốn ga về ga <span class="han">梨园</span> Lê Viên, đi bộ 350m về khách sạn · 3 CNY · đây chính là lý do chọn khách sạn ở Thông Châu',
        'Line 1 four stops back to <span class="han">梨园</span> Liyuan, then a 350m walk to the hotel · CNY 3 · this is the whole reason for a Tongzhou hotel',
        '1号线坐四站回<span class="han">梨园</span>站，步行350米到酒店 · 3元 · 这正是选择通州酒店的理由']},
      {t:["≈ 21:00","≈ 21:00","约21:00"], b:["Về tới khách sạn Thông Châu, gặp lại hai bạn kia","At the Tongzhou hotel with the others","抵达通州酒店，与另两人会合"],
       d:["Gia Bảo và Quỳnh Mai về trước khoảng một tiếng. Hôm nay là ngày dài nhất của bạn trong cả chuyến - ngủ sớm, mai 6:15 đã phải rời khách sạn.",
          "Gia Bao and Quynh Mai got back about an hour earlier. Today is your longest day of the whole trip - sleep early, tomorrow starts at 06:15.",
          "嘉宝和琼梅早约一小时回来。今天是全程最长的一天——早点睡，明天6:15就要出门。"]}
     ]},
   { cls:"home", p:["ta"], h:["Bay về Hà Nội","Fly home to Hanoi","飞回河内"], who:["Tuấn Anh","Tuan Anh","俊英"],
     slots:[
      {t:["07:30","07:30","07:30"], b:["Trả phòng BNU cùng cả nhóm","Check out of BNU with the others","与大家一同退宿舍"],
       d:["Ba người kia đi ga Sa Hà, Tuấn Anh tách ra ở đây. Chào tạm biệt xong là ai đi đường nấy.",
          "The other three head for Shahe station; Tuan Anh splits off here. Say goodbye and go your separate ways.",
          "另外三人去沙河站，俊英在这里分开。道别之后各走各的路。"]},
      {m:1, t:["45–120 phút","45–120 min","45–120分钟"], a:["Xương Bình → sân bay Thủ Đô · taxi khoảng 45 phút, 150 CNY · hoặc tuyến Xương Bình → tuyến 13 → tàu nhanh sân bay, khoảng 2 tiếng, 32 CNY",
        "Changping → Capital Airport · taxi about 45 min, CNY 150 · or Changping Line → Line 13 → Airport Express, about 2h, CNY 32",
        "昌平 → 首都机场 · 打车约45分钟150元 · 或昌平线→13号线→机场快轨，约2小时32元"]},
      {t:["Trước 3 tiếng","3 hours ahead","提前3小时"], b:["Có mặt ở sân bay Thủ Đô","At Capital Airport","抵达首都机场"],
       d:["Chuyến quốc tế nên tính sớm 3 tiếng. Vé về của Tuấn Anh chưa đặt: Vietnam Airlines VN513 và Air China CA741 đều bay thẳng về Nội Bài, cất cánh khoảng giữa trưa tới đầu giờ chiều. Chốt vé rồi thì trừ ngược lại giờ rời campus.",
          "An international departure, so allow 3 hours. His ticket is not booked yet: Vietnam Airlines VN513 and Air China CA741 both fly direct to Noi Bai, leaving around midday to early afternoon. Once the ticket is fixed, work the campus departure time backwards from it.",
