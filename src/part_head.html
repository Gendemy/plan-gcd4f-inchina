<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kế hoạch 10 ngày Thâm Quyến – Bắc Kinh – Thượng Hải cho Team Gendemy, GCD4F Global Finals 2026.">
<style>
  :root{color-scheme:light dark}
  html,body{margin:0;padding:0}
  img{max-width:100%}
  [hidden]{display:none!important}
  @media print{
    .day,.leg{break-inside:avoid}
    .card,.panel,.track,.callout,.tablewrap{break-inside:avoid}
    header{padding-top:0}
  }
</style>
<title>Kế hoạch GCD4F · Trung Quốc 10/2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Ma+Shan+Zheng&family=Montserrat:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap">
<style>
:root{
  --sans:"Montserrat","Segoe UI",system-ui,sans-serif;
  --display:"Quicksand","Montserrat","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  --han:"Kaiti SC","STKaiti",KaiTi,SimKai,"楷体","Ma Shan Zheng","Noto Serif SC",serif;

  --ground:#ECEFEA; --surface:#FFFFFF; --surface-2:#F5F7F3;
  --ink:#111A17; --ink-2:#3E4C48; --ink-3:#6D7B76;
  --rule:#D5DBD3; --rule-soft:#E3E8E1;
  --jade:#1C6B58; --jade-soft:#E0EDE7;
  --sz:#0D6F7C; --bj:#AD4527; --sh:#3A4C97; --ochre:#846312;
  --warn-bg:#FBF1E8; --warn-rule:#E2BD9B;
  --shadow:0 1px 2px rgba(17,26,23,.05), 0 8px 24px -14px rgba(17,26,23,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1513; --surface:#161F1C; --surface-2:#1B2521;
    --ink:#E8EDE9; --ink-2:#B0BCB6; --ink-3:#818E88;
    --rule:#2B3733; --rule-soft:#232E2A;
    --jade:#6BC0A5; --jade-soft:#1A2C27;
    --sz:#4FB6C2; --bj:#E08063; --sh:#8899DE; --ochre:#D2AA4C;
    --warn-bg:#241D16; --warn-rule:#5C452D;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1513; --surface:#161F1C; --surface-2:#1B2521;
  --ink:#E8EDE9; --ink-2:#B0BCB6; --ink-3:#818E88;
  --rule:#2B3733; --rule-soft:#232E2A;
  --jade:#6BC0A5; --jade-soft:#1A2C27;
  --sz:#4FB6C2; --bj:#E08063; --sh:#8899DE; --ochre:#D2AA4C;
  --warn-bg:#241D16; --warn-rule:#5C452D;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:15.5px;line-height:1.66;-webkit-font-smoothing:antialiased}
.wrap{max-width:940px;margin:0 auto;padding:0 24px 96px}

h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.18;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,5.6vw,3.4rem)}
h2{font-size:clamp(1.45rem,3.2vw,1.95rem)}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
strong{font-weight:600;color:var(--ink)}
em{font-style:normal;color:var(--ink);font-weight:500}
a{color:var(--jade);text-underline-offset:3px;text-decoration-thickness:1px}
a:focus-visible{outline:2px solid var(--jade);outline-offset:3px;border-radius:3px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.han{font-family:var(--han);font-size:1.14em;line-height:1;letter-spacing:.02em}
.eyebrow{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

header{padding:68px 0 40px;border-bottom:1px solid var(--rule)}
header .kicker{color:var(--jade);margin-bottom:18px}
header h1{max-width:16ch}
header .lede{margin-top:20px;max-width:62ch;font-size:1.03rem;color:var(--ink-2);font-weight:300}
.meta{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:28px;font-family:var(--mono);font-size:.76rem;color:var(--ink-3)}
.meta b{color:var(--ink-2);font-weight:500}

.route{display:block;width:100%;height:auto;margin:34px 0 4px}
.route text{font-family:var(--mono);fill:var(--ink-3);font-size:11px}
.route text.city{font-family:var(--display);font-weight:600;fill:var(--ink);font-size:15px}
.route .hop{stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:3 4;opacity:.8}
.route .node{fill:var(--ground);stroke:var(--ink-2);stroke-width:1.6}
.route .tick{stroke:var(--rule);stroke-width:1}

.banner{display:block;width:100%;height:auto;margin:20px 0 2px;color:var(--accent,var(--jade))}
.banner .ln{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.banner .soft{fill:none;stroke:currentColor;stroke-width:1;opacity:.34}
.figcap{font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.glyph{width:42px;height:42px;flex:none;color:var(--accent,var(--jade))}

section{padding-top:58px}
.sec-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.sec-note{margin:0 0 26px;max-width:64ch;color:var(--ink-2);font-weight:300}

.urgent{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:20px 22px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.card .num{font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.1em;color:var(--jade)}
.card p{font-size:.88rem;color:var(--ink-2);font-weight:300}

.callout{background:var(--warn-bg);border:1px solid var(--warn-rule);border-left-width:3px;border-radius:3px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.callout h3{color:var(--bj)}
.callout p{font-size:.92rem;color:var(--ink-2);font-weight:300}
.callout .fix{font-size:.92rem;color:var(--ink);padding-top:4px;border-top:1px solid var(--warn-rule)}

.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:540px;font-size:.87rem}
th,td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--rule-soft);vertical-align:top;font-weight:300}
thead th{font-family:var(--mono);font-size:.67rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--rule)}
tbody tr:last-child td{border-bottom:none}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.num{text-align:right}
tr.total td{background:var(--surface-2);font-weight:600;color:var(--ink);border-top:1px solid var(--rule)}
.when{font-family:var(--mono);font-size:.8rem;color:var(--bj);white-space:nowrap;font-weight:500}

/* who is on which track */
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.track{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:20px 22px;border-top:3px solid var(--tc)}
.track.a{--tc:var(--jade)} .track.b{--tc:var(--bj)}
.track h3{color:var(--tc)}
.track .names{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);margin-top:6px}
.track p{font-size:.88rem;color:var(--ink-2);font-weight:300;margin-top:9px}

.city{margin-top:60px}
.city-band{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:11px;border-bottom:2px solid var(--accent)}
.city-band h2{color:var(--accent)}
.city-band .cn{font-family:var(--han);font-size:1.5rem;color:var(--ink-3);line-height:1}
.city-band .span{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--ink-3)}
.city-intro{margin:16px 0 4px;max-width:64ch;color:var(--ink-2);font-size:.93rem;font-weight:300}
#shenzhen{--accent:var(--sz)}
#beijing{--accent:var(--bj)}
#shanghai{--accent:var(--sh)}

.day{display:grid;grid-template-columns:100px 1fr;gap:28px;padding:30px 0;border-bottom:1px solid var(--rule-soft)}
.day:last-child{border-bottom:none}
.daymark{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:1px}
.daymark .dnum{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;color:var(--accent,var(--jade))}
.daymark .dmon,.daymark .ddow{font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;color:var(--ink-3)}
.daymark .ddow{text-transform:uppercase}
.daybody{display:flex;flex-direction:column;gap:16px;min-width:0}
.dayhead{display:flex;align-items:center;gap:13px;margin-bottom:-4px;flex-wrap:wrap}

.slots{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:10px 0;border-top:1px dotted var(--rule)}
.slot:first-child{border-top:none;padding-top:0}
.slot .t{font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--ink-3);padding-top:3px;white-space:nowrap}
.slot .a{min-width:0}
.slot .a b{font-weight:600;color:var(--ink)}
.slot .a .d{display:block;font-size:.86rem;color:var(--ink-2);margin-top:3px;font-weight:300}
.slot.move{padding:6px 0;border-top:none}
.slot.move .t{font-size:.72rem;color:var(--ink-3);opacity:.75;padding-top:1px}
.slot.move .a{font-size:.8rem;color:var(--ink-3);font-weight:300}
.slot.move .a::before{content:"↓\00a0\00a0";font-family:var(--mono);opacity:.55}
.dur{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.04em;color:var(--ink-3);border:1px solid var(--rule);border-radius:3px;padding:1px 6px;margin-left:8px;white-space:nowrap;vertical-align:1px}
.tag{display:inline-block;font-family:var(--mono);font-size:.65rem;font-weight:600;letter-spacing:.05em;padding:1px 6px;border-radius:3px;margin-left:7px;vertical-align:1px;background:var(--jade-soft);color:var(--jade);white-space:nowrap}
.tag.pay{background:transparent;color:var(--ochre);border:1px solid var(--ochre)}
.tag.host{background:transparent;color:var(--ink-3);border:1px dashed var(--rule)}
.tag.ta{background:transparent;color:var(--bj);border:1px solid var(--bj)}

.leg{border-left:3px solid var(--lc);padding-left:20px;margin-top:8px}
.leg-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.leg-head h4{font-family:var(--display);font-weight:700;font-size:1rem;margin:0;color:var(--lc)}
.leg-head .who{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--ink-3)}
.leg.wall{--lc:var(--bj)} .leg.uni{--lc:var(--sh)} .leg.home{--lc:var(--ink-3)}

.note{font-size:.86rem;color:var(--ink-2);background:var(--surface-2);border-left:2px solid var(--rule);padding:11px 16px;border-radius:0 3px 3px 0;font-weight:300}
.note b{color:var(--ink);font-weight:600}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:22px 24px}
.panel h3{margin-bottom:12px}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.panel li{font-size:.88rem;color:var(--ink-2);font-weight:300}
.panel li::marker{color:var(--jade)}

.levers{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:3px;background:var(--surface)}
.lever{display:grid;grid-template-columns:1fr auto;gap:20px;padding:15px 22px;border-bottom:1px solid var(--rule-soft);align-items:center}
.lever:last-child{border-bottom:none}
.lever .save{font-family:var(--mono);font-size:.84rem;font-weight:600;color:var(--jade);white-space:nowrap}
.lever p{font-size:.88rem;color:var(--ink-2);font-weight:300}

footer{margin-top:70px;padding-top:26px;border-top:1px solid var(--rule);font-size:.8rem;color:var(--ink-3);font-weight:300}
footer a{color:var(--ink-3)}
footer ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

@media (max-width:640px){
  .day{grid-template-columns:1fr;gap:14px}
  .daymark{position:static;flex-direction:row;align-items:baseline;gap:10px}
  .daymark .dnum{font-size:1.45rem}
  .slot{grid-template-columns:1fr;gap:2px}
  .slot .t{padding-top:0}
  .slot.move .a::before{content:"↳\00a0\00a0"}
  header{padding:48px 0 32px}
  .glyph{width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
